name: Build ORBIT Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "electron/**"
      - "package.json"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Build Windows app
        run: npm run desktop:dist
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Windows
          path: dist-desktop/*
