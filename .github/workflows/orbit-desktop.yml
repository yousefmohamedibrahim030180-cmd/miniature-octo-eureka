name: ORBIT Desktop Build

on:
  workflow_dispatch:
  push:
    paths:
      - "electron/**"
      - "package.json"
      - ".github/workflows/orbit-desktop.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build ORBIT for Windows
        run: npm run desktop:dist

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Windows
          path: |
            dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish public ORBIT release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orbit-latest
          name: ORBIT Desktop (Latest)
          body: |
            Latest Windows build of ORBIT Desktop.
            Download the installer (.exe) or portable executable.
          files: |
            dist-desktop/*.exe
          make_latest: true
          prerelease: false
