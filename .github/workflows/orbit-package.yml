name: ORBIT source package
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: |
          rm -f .github/workflows/orbit-package.yml
          zip -qr /tmp/ORBIT-project.zip . -x '.git/*'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-project-source
          path: /tmp/ORBIT-project.zip
          if-no-files-found: error
          retention-days: 1
