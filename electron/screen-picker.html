<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORBIT — Choose what to share</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050811;color:#eef3ff;font-family:Inter,Segoe UI,system-ui,sans-serif}
body{overflow:hidden}
.shell{height:100%;display:flex;flex-direction:column;background:
 radial-gradient(circle at 50% 0,rgba(124,101,255,.16),transparent 35%),
 radial-gradient(circle at 90% 90%,rgba(63,226,255,.08),transparent 28%),
 #050811}
.head{height:82px;min-height:82px;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:11px;align-items:center}.orb{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#8665ff,#51e5ff);box-shadow:0 0 30px rgba(118,96,255,.35);font-weight:900}
.title{font:700 18px/1.1 "Segoe UI",sans-serif}.sub{margin-top:4px;color:#7f8ca3;font-size:9px}
.actions{display:flex;gap:7px}.btn{height:35px;padding:0 12px;border:1px solid rgba(255,255,255,.10);border-radius:9px;background:rgba(255,255,255,.04);color:#dfe7f6;font-weight:700;cursor:pointer}.btn:hover{background:rgba(255,255,255,.08)}.btn.primary{background:linear-gradient(120deg,#8e67ff,#53dcff);border:0;color:#fff}
.body{flex:1;min-height:0;padding:18px;display:flex;flex-direction:column;gap:13px}
.tabs{display:flex;gap:7px}.tab{height:34px;padding:0 11px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(255,255,255,.03);color:#8390a7;font-weight:700;cursor:pointer}.tab.active{color:#fff;border-color:rgba(120,107,255,.35);background:rgba(118,99,255,.12)}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px;padding-right:2px}
.card{position:relative;min-height:185px;padding:9px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));cursor:pointer;transition:.18s ease;overflow:hidden}
.card:hover{transform:translateY(-2px);border-color:rgba(102,222,255,.30);box-shadow:0 18px 50px rgba(0,0,0,.25),0 0 30px rgba(105,97,255,.08)}
.thumb{width:100%;height:145px;border-radius:10px;background:#0a101b;object-fit:cover;display:block}
.meta{display:flex;align-items:center;justify-content:space-between;padding:9px 2px 1px}.name{font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kind{font-size:6px;letter-spacing:.14em;color:#6d7b91}.empty{display:grid;place-items:center;min-height:300px;color:#7c899e;font-size:10px;text-align:center}
.pick{position:absolute;right:12px;bottom:48px;height:30px;padding:0 10px;border-radius:8px;border:1px solid rgba(100,224,255,.22);background:rgba(5,10,18,.82);color:#dff8ff;font-size:8px;font-weight:800;opacity:0;transform:translateY(5px);transition:.16s}.card:hover .pick{opacity:1;transform:none}
.badge{position:absolute;left:15px;top:15px;padding:5px 7px;border-radius:7px;background:rgba(4,8,15,.78);border:1px solid rgba(255,255,255,.08);font-size:6px;letter-spacing:.12em;color:#9ceaff}
@media(max-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.head{padding:14px}.body{padding:12px}}
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="brand"><div class="orb">◈</div><div><div class="title">Choose what to share</div><div class="sub">Select a monitor or application window for ORBIT screen sharing.</div></div></div>
    <div class="actions"><button class="btn" id="cancel">Cancel</button></div>
  </header>
  <main class="body">
    <div class="tabs"><button class="tab active" data-tab="all">All</button><button class="tab" data-tab="screen">Monitors</button><button class="tab" data-tab="window">Windows</button></div>
    <section class="grid" id="grid"><div class="empty">Loading available screens and windows…</div></section>
  </main>
</div>
<script>
const {ipcRenderer}=require("electron");
let sources=[];
const grid=document.getElementById("grid");
let filter="all";
const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function render(){
  const rows=sources.filter(s=>filter==="all"||s.type===filter);
  if(!rows.length){grid.innerHTML='<div class="empty">No sources available in this category.</div>';return}
  grid.innerHTML=rows.map(s=>'<article class="card" data-id="'+esc(s.id)+'"><span class="badge">'+(s.type==="screen"?"MONITOR":"WINDOW")+'</span><img class="thumb" src="'+esc(s.thumbnail||s.appIcon||"")+'" alt=""><div class="meta"><span class="name">'+esc(s.name)+'</span><span class="kind">'+(s.type==="screen"?"DISPLAY":"APP WINDOW")+'</span></div><button class="pick">Share this</button></article>').join("");
  grid.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("dblclick",()=>pick(card.dataset.id));
    card.addEventListener("click",e=>{if(e.target.closest(".pick"))return;grid.querySelectorAll(".card").forEach(x=>x.style.borderColor="");card.style.borderColor="rgba(102,222,255,.42)"});
    card.querySelector(".pick").addEventListener("click",()=>pick(card.dataset.id));
  });
}
function pick(id){ipcRenderer.send("orbit-screen-picker-select",id)}
document.getElementById("cancel").onclick=()=>ipcRenderer.send("orbit-screen-picker-cancel");
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{filter=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});
ipcRenderer.on("orbit-screen-sources",(_e,p)=>{sources=Array.isArray(p)?p:[];render()});
ipcRenderer.on("orbit-screen-picker-error",(_e,msg)=>alert(msg||"Unable to share this source."));
document.addEventListener("keydown",e=>{if(e.key==="Escape")ipcRenderer.send("orbit-screen-picker-cancel")});
</script>
</body>
</html>
