<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a10"><title>ORBIT — AAA Communication Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/orbit-v2.css?v=custom4"><link rel="stylesheet" href="/orbit-atmosphere.css?v=orbit4"><link rel="stylesheet" href="/orbit-v2-enhancements.css?v=realsettings2"><link rel="stylesheet" href="/orbit-v3.css?v=3safe1"><link rel="stylesheet" href="/orbit-v3-1.css?v=3live1"><link rel="stylesheet" href="/orbit-call.css?v=call2">
</head>
<body>
<div id="boot"></div>
<div id="app" class="app hidden">
 <aside class="rail">
  <div class="brand"><span class="brand-mark">O</span><div><strong>ORBIT</strong><small>AAA COMMUNICATION OS</small></div></div>
  <button class="rail-search" id="searchBtn"><span>⌕</span><span>Search anything</span><kbd>Ctrl K</kbd></button>
  <div class="rail-label">Navigate</div>
  <nav id="nav"></nav>
  <div class="rail-spacer"></div>
  <div class="mini-wallet"><span>✦</span><div><strong id="coinMini">0</strong><small>ORBIT COINS</small></div></div>
  <button class="rail-profile" id="profileBtn"></button>
 </aside>
 <aside class="server-dock" id="serverDock"></aside>
 <aside class="context" id="context"></aside>
 <main class="main">
  <header class="topbar"><div class="crumb"><span>ORBIT</span><b>/</b><strong id="viewTitle">Home</strong></div><div class="top-actions">
   <button class="top-action" id="commandBtn">⌘ Command</button><button class="top-icon" id="notifyBtn">♢<b id="notifyCount"></b></button><button class="top-icon" id="dmBtn">◈</button><button class="online">● Online</button>
  </div></header>
  <section class="surface" id="surface"></section>
 </main>
</div>
<div id="modalRoot"></div>
<div id="toastStack"></div>
<section class="call-overlay hidden" id="callOverlay">
 <div class="call-window mode-gallery" id="callWindow">
  <header class="call-header" id="callDragHandle">
   <div><span class="eyebrow">ORBIT CALL · LIVE ROOM</span><strong id="callTitle">Live Call</strong><small id="callStatus"><span class="call-live-dot"></span>Connecting</small></div>
   <div class="call-header-actions">
    <span class="call-info-pill" id="callDuration">00:00</span>
    <button class="call-window-btn" id="callModeFocus" title="Focus">●</button>
    <button class="call-window-btn" id="callModeGallery" title="Gallery">▦</button>
    <button class="call-window-btn" id="callModeCinema" title="Cinema">▤</button>
    <button class="call-window-btn" id="callMinimize" title="Minimize">—</button>
    <button class="call-window-btn" id="callMaximize" title="Maximize">□</button>
    <button class="call-window-btn" id="callClose" title="Close">×</button>
   </div>
  </header>
  <div class="call-stage" id="callStage"></div>
  <div class="call-controls">
   <div class="call-left">
    <button id="micBtn" class="call-control" title="Microphone">🎙</button>
    <button id="camBtn" class="call-control" title="Camera">◉</button>
    <button id="screenBtn" class="call-control icon-wide" title="Screen share">▣ Share</button>
   </div>
   <div class="call-center">
    <div class="call-modes">
     <button class="call-mode active" id="callModeGalleryBottom">Gallery</button>
     <button class="call-mode" id="callModeFocusBottom">Focus</button>
     <button class="call-mode" id="callModeCinemaBottom">Cinema</button>
    </div>
   </div>
   <div class="call-right"><button id="leaveCallBtn" class="leave-btn">Leave</button></div>
  </div>
 </div>
</section>
<section class="incoming hidden" id="incoming"><span id="incomingAvatar"></span><div><strong id="incomingName">Incoming call</strong><span id="incomingMode">Video call</span></div><div class="incoming-actions"><button id="acceptCall" class="accept">Accept</button><button id="declineCall" class="decline">Decline</button></div></section>
<script src="/socket.io/socket.io.js"></script><script src="/orbit-atmosphere.js?v=orbit4"></script><script src="/orbit-v2.js?v=voice1"></script><script src="/orbit-v2-enhancements.js?v=realsettings2"></script><script src="/orbit-v3.js?v=3safe1"></script><script src="/orbit-v3-1.js?v=3live1"></script>\n</body></html>
