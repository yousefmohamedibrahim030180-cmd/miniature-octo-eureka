<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit — Realtime Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app" class="app">
  <aside class="server-rail">
    <div class="rail-logo">◈</div>
    <div id="server-list" class="server-list"></div>
    <button id="new-server" class="rail-btn" title="Create server">+</button>
  </aside>
  <aside class="sidebar">
    <div class="workspace-head"><div><strong id="workspace-name">Orbit Lobby</strong><span id="workspace-role">guest</span></div><button id="workspace-menu">⋯</button></div>
    <div class="section-title">CHANNELS <button id="new-channel" title="Create channel">+</button></div>
    <div id="channel-list" class="channel-list"></div>
    <div class="sidebar-bottom">
      <div class="profile"><div class="avatar" id="me-avatar">G</div><div><strong id="me-name">Guest</strong><span id="me-status">online</span></div><button id="rename-guest" title="Change name">✎</button></div>
    </div>
  </aside>
  <main class="chat">
    <header class="chat-head"><div><span class="hash">#</span><div><strong id="channel-name">general</strong><span id="channel-meta">Realtime conversation</span></div></div><div class="head-actions"><button id="invite-btn">Invite</button><button id="members-btn">Members</button><button id="admin-btn">Control</button></div></header>
    <section id="messages" class="messages"><div class="empty"><div class="empty-icon">✦</div><h2>Welcome to Orbit.</h2><p>No account required. Pick a channel and start chatting.</p></div></section>
    <div id="typing" class="typing"></div>
    <form id="composer" class="composer"><button type="button" id="attach">+</button><input id="message" placeholder="Message #general" autocomplete="off"><button class="send">Send</button></form>
  </main>
  <aside id="members-panel" class="members-panel hidden"><div class="panel-head"><strong>Members</strong><button id="close-members">×</button></div><div id="member-list"></div></aside>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><strong id="modal-title"></strong><button id="modal-close">×</button></div><div id="modal-body"></div></div></div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
