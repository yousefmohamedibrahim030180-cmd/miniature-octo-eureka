<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a10">
<title>ORBIT — Rebuilt Social Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/orbit-rebuild.css?v=20260923.2">\n<link rel="stylesheet" href="/orbit-server-dock.css?v=20260921">\n<link rel="stylesheet" href="/orbit-chat-settings-v2.css?v=20260921">\n<link rel="stylesheet" href="/orbit-settings-glass.css?v=20260921">\n<link rel="stylesheet" href="/orbit-incoming-call.css?v=20260923"><link rel="stylesheet" href="/orbit-atmosphere.css?v=20260923.1">
</head>
<body>
<div id="boot"></div>
<div id="app" class="app easy-shell hidden">
<aside class="rail">
<div class="brand"><span class="brand-mark">O</span><div class="brand-copy"><strong>ORBIT</strong><small>SOCIAL OPERATING SYSTEM</small></div></div>
<button class="search" id="search-open"><span>⌕</span><span>Search ORBIT</span><kbd>Ctrl K</kbd></button>
<div class="label">Navigate</div><div class="server-dock" id="server-dock"></div><nav class="nav" id="rail-nav"></nav>
<div class="spacer"></div>
<div class="status-card"><span class="status-dot"></span><div><strong>Systems online</strong><span id="system-status">Realtime ready</span></div></div>
<button class="profile" id="profile-open"><span class="avatar" id="rail-avatar">G</span><span class="profile-copy"><strong id="rail-name">Guest</strong><span id="rail-handle">@guest</span></span><span>•••</span></button>
</aside>
<aside class="context">
<div class="ctx-head"><div><span class="eyebrow">ORBIT</span><h2 id="ctx-title">Home</h2></div><button class="icon" id="collapse">‹</button></div>
<div class="ctx-body" id="ctx-body"></div>
</aside>
<main class="main">
<header class="top">
<div class="crumb"><span>ORBIT</span><b>/</b><strong id="top-title">Home</strong></div>
<div class="top-actions">
<button class="top-btn" id="command-open">⌘ Search</button>
<button class="circle" id="notifications">♢<b id="notification-count"></b></button>
<button class="circle" id="messages-open">◈<b id="message-count"></b></button>
<button class="circle" id="calls-open">◉</button>
<button class="status-btn"><i></i>Online</button>
</div>
</header>
<section class="surface" id="surface"></section>
</main>
</div>
<div id="modal-root"></div>
<section class="call hidden" id="call-overlay"><div class="call-win"><header class="call-top"><div><span class="eyebrow">LIVE CALL</span><strong id="call-title">Orbit Call</strong><small id="call-subtitle">Connecting</small></div><button class="icon" id="call-close">×</button></header><div class="call-stage" id="call-stage"></div><div class="call-bar"><div><button class="call-btn" id="call-mic">🎙</button><button class="call-btn" id="call-camera">◉</button><button class="call-btn" id="call-screen">▣ Share</button></div><button class="leave" id="call-leave">Leave</button></div></div></section>
<section class="incoming hidden" id="incoming"><span class="avatar" id="incoming-avatar">G</span><div class="incoming-copy"><strong id="incoming-title">Incoming call</strong><span id="incoming-subtitle">Someone is calling</span></div><button class="accept" id="incoming-accept">Accept</button><button class="decline" id="incoming-decline">Decline</button></section>
<div class="toast-stack" id="toast-stack"></div>
<script src="/socket.io/socket.io.js?v=4.8"></script>
<script src="/orbit-rebuild.js?v=20260923.2"></script>\n<script src="/orbit-settings-v2.js?v=20260921"></script>\n<script src="/orbit-settings-user-hotfix.js?v=20260921"></script>\n<script src="/orbit-incoming-call.js?v=20260923"></script><script src="/orbit-atmosphere.js?v=20260923.1"></script>
</body>
</html>
